name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Vite 8 / Vitest 4 require ^20.19 || >=22.12; 22 is the current LTS line.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check built extension
        run: |
          node --input-type=module -e '
            import { readFileSync, existsSync } from "node:fs";
            import vm from "node:vm";

            const fail = (msg) => { console.error(`::error::${msg}`); process.exit(1); };

            if (!existsSync("dist/manifest.json")) fail("dist/manifest.json is missing");
            try {
              JSON.parse(readFileSync("dist/manifest.json", "utf8"));
            } catch (err) {
              fail(`dist/manifest.json is not valid JSON: ${err.message}`);
            }

            // capture.js is injected with chrome.scripting.executeScript({ files }),
            // which runs it as a classic script. Compiling it as one rejects any
            // static import/export, so the bundle must stay self-contained.
            if (!existsSync("dist/capture.js")) fail("dist/capture.js is missing");
            try {
              new vm.Script(readFileSync("dist/capture.js", "utf8"), { filename: "dist/capture.js" });
            } catch (err) {
              fail(`dist/capture.js is not a self-contained classic script: ${err.message}`);
            }

            console.log("dist/manifest.json and dist/capture.js look sane.");
          '
